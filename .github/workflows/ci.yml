name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment halfway through migrations/restart.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  PHP_VERSION: '8.2'
  # Official Trivy v0.76.2 (linux/amd64), pinned to an immutable manifest.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6

jobs:
  # ============================================================
  # Job 1: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit, phpcs

      - name: Validate composer
        run: composer validate --strict || echo "⚠️ composer.json not strict"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            chat-graph/package-lock.json

      - name: MCP contract tests and build
        working-directory: mcp-server
        run: |
          npm ci
          npm test
          npm run build

      # The graph suite (scripted LLM, no network) is the CI eval for the chatbot.
      # chat-graph compiles ../mcp-server/src, so mcp-server must be installed first.
      - name: chat-graph tests and build
        run: |
          npm --prefix chat-graph ci
          npm --prefix chat-graph test
          npm --prefix chat-graph run build

      - name: PHP Lint
        run: |
          ERRORS=0
          while IFS= read -r f; do
            php -l "$f" 2>/dev/null | grep -q "No syntax errors" || { echo "❌ $f"; ERRORS=$((ERRORS+1)); }
          done < <(find public src config scripts templates tests -name '*.php')
          [ "$ERRORS" -eq 0 ] && echo "✅ All PHP syntax OK" || exit 1

      - name: PHPCS (PSR-12)
        run: |
          vendor/bin/phpcs --standard=PSR12 --extensions=php \
            --ignore=test-evidence,reports,.codex,.agents,vendor,tests,public/assets \
            --error-severity=1 --warning-severity=0 . || echo "⚠️ Style issues (non-blocking)"

      - name: PHPStan
        run: vendor/bin/phpstan analyse --level=1 config/ src/ --no-progress

      - name: Python lint (reranker)
        run: |
          python3 -m py_compile docker/reranker/app.py docker/rag-ml/app.py && echo "✅ Python syntax OK"

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring, sqlite3
          tools: composer, phpunit

      - name: Load the app image's php.ini (timezone, opcache)
        run: sudo cp docker/php.ini "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/zz-shop.ini" && php -r 'echo date_default_timezone_get(), PHP_EOL;'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit --testsuite=Unit --colors=always --display-warnings
        env:
          APP_ENV: test

  # ============================================================
  # Job 3: Integration Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: [code-quality]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_pass
          MARIADB_DATABASE: shop_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, curl, mbstring

      - name: Load the app image's php.ini (timezone, opcache)
        run: sudo cp docker/php.ini "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/zz-shop.ini" && php -r 'echo date_default_timezone_get(), PHP_EOL;'

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -u root -proot_pass 2>/dev/null && break
            sleep 1
          done

      - name: Import schema
        run: sed '/^CREATE DATABASE/d;/^USE /d' database/schema.sql | mysql -h127.0.0.1 -u root -proot_pass shop_test

      # The migration script loads vendor/autoload.php, so dependencies first.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Apply database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: shop_test
          DB_USER: root
          DB_PASS: root_pass
        run: php scripts/run_database_migrations.php

      - name: Run Integration Tests
        env:
          APP_ENV: test
          DB_HOST: 127.0.0.1
          DB_NAME: shop_test
          DB_USER: root
          DB_PASS: root_pass
        run: vendor/bin/phpunit --testsuite=Integration --colors=always --display-warnings

  # ============================================================
  # Job 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for real secrets (API keys, tokens, private keys)..."
          # Only flag actual secret STRINGS — NOT PHP variable names
          #   sk-[a-z0-9]{20,}     → API keys
          #   -----BEGIN           → private keys
          #   ghp_xxx / github_pat → GitHub tokens
          SECRETS=$(grep -rlP '(?<![-\$>])sk-[A-Za-z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{85}|-----BEGIN\s+(RSA|OPENSSH|EC|DSA)\s+PRIVATE\s+KEY-----' \
            --include='*.php' --include='*.py' --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.json' --include='*.md' \
            . 2>/dev/null | grep -v '.git/' | grep -v 'vendor/' || true)
          if [ -n "$SECRETS" ]; then
            echo "❌ Files with potential secrets (contents redacted):"
            echo "$SECRETS"
            exit 1
          fi
          echo "✅ No secrets found"

      - name: Check for hardcoded passwords
        run: |
          echo "ℹ️  Checking for hardcoded passwords in auth files..."
          # Flag literal password === compares with real values
          BAD=$(grep -rlP "password\s*===\s*'[^']{4,}'" \
            --include='*.php' \
            . 2>/dev/null | grep -v '.git/' | grep -v 'vendor/' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Hardcoded password found:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ No hardcoded passwords"

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v $PWD:/src "$TRIVY_IMAGE" fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs vendor \
            --skip-dirs .git \
            /src

  # ============================================================
  # Job 5: Docker Build (app + reranker + chat-graph + rag-ml)
  # ============================================================
  docker:
    name: Docker Build
    permissions:
      contents: read
      packages: write
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose profiles
        run: |
          # docker-compose.yml intentionally consumes the operator-managed
          # .env file at runtime. CI validates only interpolation/schema, so
          # materialise the tracked non-secret example for this disposable job.
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile observability config --quiet
          docker compose config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]["rag-ml"]; assert not any(m["target"] in ("/models", "/models/onnx") for m in s.get("volumes", [])), "model image is masked by a volume"'
          APP_IMAGE=example.invalid/app:sha CHAT_GRAPH_IMAGE=example.invalid/chat-graph:sha RERANKER_IMAGE=example.invalid/reranker:sha RAG_ML_IMAGE=example.invalid/rag-ml:sha docker compose config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert all(s[n]["image"] == "example.invalid/"+n+":sha" for n in ("app", "chat-graph", "reranker", "rag-ml"))'
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          test "$(docker compose -f docker-compose.yml -f docker-compose.production.yml config --services | sort)" = "$(printf '%s\n' app chat-graph db nginx qdrant rag-ml redis reranker)"

      - name: Build app image
        run: |
          docker build -t shop-quan-ao:ci-${{ github.sha }} .
          docker tag shop-quan-ao:ci-${{ github.sha }} shop-quan-ao:ci-latest

      - name: App image serves when php-fpm is slow to start
        # The base image's php-fpm readiness check gives up after 7s; docker/app-php-fpm-run keeps polling.
        run: scripts/dev/app-image-slow-fpm.sh shop-quan-ao:ci-latest

      - name: Build reranker image
        run: |
          docker build -t shop-reranker:ci-${{ github.sha }} docker/reranker/
          docker tag shop-reranker:ci-${{ github.sha }} shop-reranker:ci-latest

      - name: Build chat-graph image
        run: |
          docker build -f chat-graph/Dockerfile -t shop-chat-graph:ci-${{ github.sha }} .
          docker tag shop-chat-graph:ci-${{ github.sha }} shop-chat-graph:ci-latest

      - name: Build rag-ml image
        run: |
          docker build -t shop-rag-ml:ci-${{ github.sha }} docker/rag-ml/
          docker tag shop-rag-ml:ci-${{ github.sha }} shop-rag-ml:ci-latest

      - name: Scan app image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            shop-quan-ao:ci-${{ github.sha }}

      - name: Scan reranker image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            shop-reranker:ci-${{ github.sha }}

      - name: Scan chat-graph image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            shop-chat-graph:ci-${{ github.sha }}

      - name: Scan rag-ml image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            shop-rag-ml:ci-${{ github.sha }}

      - name: Publish tested commit images
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for mapping in 'app shop-quan-ao' 'reranker shop-reranker' 'chat-graph shop-chat-graph' 'rag-ml shop-rag-ml'; do
            read -r service image <<< "$mapping"
            docker tag "$image:ci-${GITHUB_SHA}" "$registry/$service:$GITHUB_SHA"
            docker push "$registry/$service:$GITHUB_SHA"
          done
          docker logout ghcr.io

  # ============================================================
  # Job 6: Deploy to Production (main/master only)
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [unit-tests, integration-tests, security, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy via SSH
        timeout-minutes: 30
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN || github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          LLM_TIMEOUT: ${{ secrets.LLM_TIMEOUT || '25' }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MARIADB_BUFFER_POOL_SIZE: ${{ vars.MARIADB_BUFFER_POOL_SIZE || '256M' }}
          MCP_SERVICE_TOKEN: ${{ secrets.MCP_SERVICE_TOKEN }}
          CHAT_GRAPH_TOKEN: ${{ secrets.CHAT_GRAPH_TOKEN || secrets.MCP_SERVICE_TOKEN }}
          LANGFUSE_ENABLED: ${{ secrets.LANGFUSE_ENABLED || 'true' }}
          LANGFUSE_PUBLIC_URL: ${{ secrets.LANGFUSE_PUBLIC_URL }}
          LANGFUSE_INGESTION_URL: ${{ secrets.LANGFUSE_INGESTION_URL || secrets.LANGFUSE_PUBLIC_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Send secrets via stdin, never through the remote command line or logs.
          python3 scripts/production-env.py > "$RUNNER_TEMP/shop-deploy.env"
          chmod 600 "$RUNNER_TEMP/shop-deploy.env"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          trap 'rm -f "$RUNNER_TEMP/shop-deploy.env"' EXIT
          # The remote script reads a shell-quoted environment prefix plus its own body.
          { cat "$RUNNER_TEMP/shop-deploy.env"; cat scripts/deploy-production.sh; } |
            ssh -o BatchMode=yes -p "$DEPLOY_PORT" "$target" 'bash -s' | tee "$RUNNER_TEMP/shop-deploy.log"
          {
            echo '## Production deployment'
            echo "Commit: $GITHUB_SHA"
            echo '```text'
            sed -n '/^=== Production metrics ===$/,/^=== End production metrics ===$/p' "$RUNNER_TEMP/shop-deploy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
